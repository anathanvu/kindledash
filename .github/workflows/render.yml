name: render-dashboard
on:
  schedule:
    # Giờ hành chính (UTC 00-12 = 07h-19h Việt Nam), thứ 2-6, mỗi 15 phút
    - cron: "2,17,32,47 0-12 * * 1-5"
    # Ngoài giờ + cuối tuần: mỗi 3 giờ 1 lần
    - cron: "17 13-23/3 * * 1-5"
    - cron: "17 */3 * * 0,6"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Render
        run: python render.py --out site
        env:
          PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
